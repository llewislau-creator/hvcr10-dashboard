name: AlphaLens P0-P1 Regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/portfolio_risk.py'
      - 'scripts/telegram_notify.py'
      - 'site/homepage.js'
      - 'site/research-app.js'
      - 'site/*.html'
      - 'tests/test_p0_p1_regression.py'
      - '.github/workflows/p0-p1-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run P0/P1 regression tests
        run: python tests/test_p0_p1_regression.py
      - name: Run existing portfolio and UI tests
        run: |
          python tests/test_portfolio_risk.py
          python tests/test_workspace_ui.py
      - name: Verify committed report artifacts
        run: python tests/test_report_artifacts.py
