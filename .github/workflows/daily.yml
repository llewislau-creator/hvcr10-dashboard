name: HVCR-10 Daily Update
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify v3 model (offline smoke tests)
        run: |
          python tests/test_phase1.py
          python tests/test_swing_v5.py
          python tests/test_execution_v4.py
          python tests/test_rebound_v3.py
      - run: python scripts/update.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily HVCR-10 report'
            git pull --rebase -X ours origin main
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Report pushed successfully on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::GitHub rejected report push after 3 attempts"
                exit 1
              fi
              echo "Push failed; waiting before retry $((attempt + 1))"
              sleep $((attempt * 15))
              git fetch origin main
              git rebase -X ours origin/main
            done
          fi
      - name: Send Telegram daily report (optional)
        if: ${{ success() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py
