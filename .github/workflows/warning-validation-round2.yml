name: AlphaLens Warning Validation Round 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/warning-validation-round2.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run second-round 20-stock comparison
        run: python scripts/run_warning_validation_round2.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: alphalens-warning-round2
          path: site/data/warning_validation_round2.json
      - name: Commit research report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/warning_validation_round2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish second-round warning validation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
